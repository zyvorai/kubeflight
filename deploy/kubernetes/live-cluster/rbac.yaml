apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: kubeflight-live-readonly}
rules:
- apiGroups: [""]
  resources: ["nodes","namespaces","pods","serviceaccounts"]
  verbs: ["get","list"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get","list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: kubeflight-live-readonly}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kubeflight-live-readonly}
subjects:
- {kind: ServiceAccount, name: kubeflight, namespace: kubeflight}
