name: Release
on:
  push: {tags: ["v*"]}
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
jobs:
  python-artifacts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with: {python-version: "3.13"}
    - run: pip install build
    - run: python -m build
    - uses: actions/upload-artifact@v7
      with: {name: python-dist, path: dist/*}
  standalone:
    strategy: {matrix: {os: [ubuntu-latest, macos-latest, windows-latest]}}
    runs-on: "${{ matrix.os }}"
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with: {python-version: "3.13"}
    - run: pip install . pyinstaller
    - run: pyinstaller --onefile --name kubeflight kubeflight/__main__.py
    - uses: actions/upload-artifact@v7
      with: {name: "binary-${{ matrix.os }}", path: dist/kubeflight*}
  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v3
      with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
    - id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          ghcr.io/${{ github.repository }}:latest
    - uses: anchore/sbom-action@v0
      with: {image: "ghcr.io/${{ github.repository }}:${{ github.ref_name }}", output-file: kubeflight-image.spdx.json}
    - uses: actions/attest-build-provenance@v2
      with: {subject-name: "ghcr.io/${{ github.repository }}", subject-digest: "${{ steps.build.outputs.digest }}", push-to-registry: true}
    - uses: actions/upload-artifact@v7
      with: {name: image-sbom, path: kubeflight-image.spdx.json}
  github-release:
    needs: [python-artifacts, standalone, image]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v4
      with: {path: release-assets, merge-multiple: true}
    - run: tar -czf kubeflight-${{ github.ref_name }}-chart.tgz -C charts kubeflight
    - run: sha256sum release-assets/* kubeflight-${{ github.ref_name }}-chart.tgz > SHA256SUMS 2>/dev/null || true
    - uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
        files: |
          release-assets/*
          kubeflight-${{ github.ref_name }}-chart.tgz
          SHA256SUMS
