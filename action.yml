name: KubeFlight Preflight
description: Deterministic Kubernetes deployment simulation and preflight checks
branding: {icon: send, color: blue}
inputs:
  path: {description: Manifest, Helm chart, Kustomize directory, or deployment root, required: true}
  baseline: {description: Optional baseline manifest/directory, required: false}
  fail-on: {description: never, high, or critical, default: critical}
  report: {description: JSON report path, default: kubeflight-report.json}
  sarif: {description: SARIF report path, default: kubeflight.sarif}
  summary: {description: Markdown summary path, default: kubeflight-summary.md}
outputs:
  report: {description: JSON report, value: "${{ inputs.report }}"}
  sarif: {description: SARIF report, value: "${{ inputs.sarif }}"}
  summary: {description: Markdown PR/step summary, value: "${{ inputs.summary }}"}
runs:
  using: composite
  steps:
  - uses: actions/setup-python@v5
    with: {python-version: "3.13", cache: pip}
  - shell: bash
    run: python -m pip install "${GITHUB_ACTION_PATH}"
  - shell: bash
    env:
      INPUT_PATH: "${{ inputs.path }}"
      INPUT_BASELINE: "${{ inputs.baseline }}"
      INPUT_FAIL_ON: "${{ inputs['fail-on'] }}"
      JSON_OUT: "${{ inputs.report }}"
      SARIF_OUT: "${{ inputs.sarif }}"
      SUMMARY_OUT: "${{ inputs.summary }}"
    run: |
      base=()
      if [[ -n "$INPUT_BASELINE" ]]; then base+=(--baseline "$INPUT_BASELINE"); fi
      kubeflight check "$INPUT_PATH" "${base[@]}" --format json --output "$JSON_OUT" --fail-on never
      kubeflight check "$INPUT_PATH" "${base[@]}" --format sarif --output "$SARIF_OUT" --fail-on never
      kubeflight check "$INPUT_PATH" "${base[@]}" --format markdown --output "$SUMMARY_OUT" --fail-on "$INPUT_FAIL_ON"
      cat "$SUMMARY_OUT" >> "$GITHUB_STEP_SUMMARY"
