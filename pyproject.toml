[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeflight"
version = "0.2.0"
description = "Know what will break before you deploy to Kubernetes."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Zyvor AI Labs"}]
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.52.4",
  "PyYAML==6.0.3",
]

[project.scripts]
kubeflight = "kubeflight.cli:main"

[tool.setuptools]
packages = ["kubeflight"]
include-package-data = true

[tool.setuptools.package-data]
kubeflight = ["web/*"]
